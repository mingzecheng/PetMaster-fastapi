# =====================================================
# Render 云平台部署配置
# 将此文件放在项目根目录，Render 会自动识别
# =====================================================

services:
  # FastAPI 后端服务
  - type: web
    name: petmaster-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_HOST
        sync: false  # 需要手动在 Render 控制台设置
      - key: DATABASE_PORT
        value: 3306
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: SECRET_KEY
        generateValue: true  # 自动生成随机密钥
      - key: DEBUG
        value: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8001
      - key: APP_NAME
        value: PetMaster
      - key: APP_VERSION
        value: 1.0.0
      - key: API_PREFIX
        value: /api/v1
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_UPLOAD_SIZE
        value: 5242880
      - key: PAYMENT_MODE
        value: mock
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: RECAPTCHA_ENABLED
        value: false
      - key: RECAPTCHA_VERSION
        value: v2
      - key: RECAPTCHA_V2_SECRET_KEY
        value: ""
      - key: RECAPTCHA_V3_SECRET_KEY
        value: ""
      - key: RECAPTCHA_V3_THRESHOLD
        value: 0.5
