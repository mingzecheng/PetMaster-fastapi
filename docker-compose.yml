# =====================================================
# PetMaster Docker Compose 配置
# 用于本地开发环境一键启动 (后端 + MySQL)
# =====================================================

services:
  # MySQL 数据库服务
  db:
    image: mysql:8.0
    container_name: petmaster-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-petmaster123}
      MYSQL_DATABASE: ${DATABASE_NAME:-petmaster}
      MYSQL_USER: ${DATABASE_USER:-petmaster}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-petmaster123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI 后端服务
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petmaster-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - DATABASE_USER=${DATABASE_USER:-petmaster}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-petmaster123}
      - DATABASE_NAME=${DATABASE_NAME:-petmaster}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8001
      - APP_NAME=PetMaster
      - APP_VERSION=1.0.0
      - API_PREFIX=/api/v1
      - CORS_ORIGINS=["*"]
      - UPLOAD_DIR=./uploads
      - MAX_UPLOAD_SIZE=5242880
      - PAYMENT_MODE=mock
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - RECAPTCHA_ENABLED=false
      - RECAPTCHA_VERSION=v2
      - RECAPTCHA_V2_SECRET_KEY=
      - RECAPTCHA_V3_SECRET_KEY=
      - RECAPTCHA_V3_THRESHOLD=0.5
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
